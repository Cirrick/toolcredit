# M10 / E7: E3 recipe + DAPO-style zero-variance group filtering with same-snapshot resampling.
# Copied from rl/configs/e3_grpo_baseline.yaml.  The only differences (plans/M10.md §3.2):
#   * algorithm.filter_groups.{enable, metric, max_num_gen_batches}  (the treatment; read only by
#     rl/custom/dynamic_filter_trainer.py — the pinned veRL fit() has no reader for it)
#   * trainer.toolcredit_trainer_class                              (runtime proof marker)
#   * trainer.project_name                                          (metadata)
#   * actor/ref fsdp_config offload flags -> false                  (pure infrastructure, verified by
#     rl/runs/e3_offload_check_20260909_150849; see plan §3.2)
# Loaded on top of veRL 0.8.0's ppo_trainer config by rl/launch/e7_dynamic_filtering.py.

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: true
    metric: score
    max_num_gen_batches: 4

data:
  train_files: rl/data/e3_train.parquet
  val_files: rl/data/e3_val_math500_100.parquet
  train_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 3072
  return_raw_chat: true
  shuffle: true
  seed: 42
  validation_shuffle: false
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: null
  dataloader_num_workers: 0
  truncation: error
  apply_chat_template_kwargs:
    enable_thinking: false

actor_rollout_ref:
  model:
    path: sft/checkpoints/qwen3-1.7b-sft
    override_config:
      attn_implementation: sdpa
  actor:
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 4
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  ref:
    log_prob_micro_batch_size_per_gpu: 4
    fsdp_config:
      param_offload: false
  rollout:
    name: sglang
    mode: async
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    n: 8
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    log_prob_micro_batch_size_per_gpu: 4
    multi_turn:
      enable: true
      # Four tool-result turns plus one final assistant answer.
      max_user_turns: 4
      max_assistant_turns: 5
      max_parallel_calls: 1
      max_tool_response_length: 512
      tool_response_truncate_side: middle
      tool_config_path: rl/custom/tool_config.yaml
      format: hermes
      tokenization_sanity_check_mode: strict
    agent:
      default_agent_loop: toolcredit_agent
      num_workers: 8
      agent_loop_config_path: rl/custom/agent_loop_config.yaml

reward:
  num_workers: 8
  custom_reward_function:
    path: rl/custom/reward.py
    name: compute_score
  reward_manager:
    source: register
    name: naive
  reward_model:
    enable: false

trainer:
  project_name: toolcredit-m10-e7
  experiment_name: replaced-by-launcher
  toolcredit_trainer_class: rl.custom.dynamic_filter_trainer.DynamicFilterRayPPOTrainer
  logger:
    - console
    - tensorboard
  nnodes: 1
  n_gpus_per_node: 1
  val_before_train: true
  log_val_generations: 10
  total_training_steps: 200
  save_freq: 25
  test_freq: 25
  resume_mode: auto
  max_actor_ckpt_to_keep: 3
  device: cuda
