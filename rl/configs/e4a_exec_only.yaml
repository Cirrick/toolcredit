# M5 / E4-A: E3 controls with exec-only reward shaping.

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
data:
  train_files: rl/data/e3_train.parquet
  val_files: rl/data/e3_val_math500_100.parquet
  train_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 3072
  return_raw_chat: true
  shuffle: true
  seed: 42
  validation_shuffle: false
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: null
  dataloader_num_workers: 0
  truncation: error
  apply_chat_template_kwargs:
    enable_thinking: false

actor_rollout_ref:
  model:
    path: sft/checkpoints/qwen3-1.7b-sft
    override_config:
      attn_implementation: sdpa
  actor:
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 4
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  ref:
    log_prob_micro_batch_size_per_gpu: 4
    fsdp_config:
      param_offload: true
  rollout:
    name: sglang
    mode: async
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    n: 8
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    log_prob_micro_batch_size_per_gpu: 4
    multi_turn:
      enable: true
      max_user_turns: 4
      max_assistant_turns: 5
      max_parallel_calls: 1
      max_tool_response_length: 512
      tool_response_truncate_side: middle
      tool_config_path: rl/custom/tool_config.yaml
      format: hermes
      tokenization_sanity_check_mode: strict
    agent:
      default_agent_loop: toolcredit_agent
      num_workers: 8
      agent_loop_config_path: rl/custom/agent_loop_config.yaml

reward:
  num_workers: 8
  custom_reward_function:
    path: rl/custom/reward.py
    name: compute_score
    reward_kwargs:
      lambda_exec: 0.2
      lambda_budget: 0.0
      budget: 3
  reward_manager:
    source: register
    name: naive
  reward_model:
    enable: false

trainer:
  project_name: toolcredit-m5
  experiment_name: replaced-by-launcher
  logger:
    - console
    - tensorboard
  nnodes: 1
  n_gpus_per_node: 1
  val_before_train: true
  log_val_generations: 10
  total_training_steps: 200
  save_freq: 25
  test_freq: 25
  resume_mode: auto
  max_actor_ckpt_to_keep: 3
  device: cuda
