tools:
  - class_name: rl.custom.sandbox_tool.ToolCreditSandboxTool
    config:
      type: native
      timeout: 5.0
    tool_schema:
      type: function
      function:
        name: code_interpreter
        description: Execute Python code in a restricted sandbox and return stdout or an explicit error.
        parameters:
          type: object
          properties:
            code:
              type: string
              description: Python source code to execute.
          required:
            - code
